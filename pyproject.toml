[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yandex-panorama-downloader"
version = "0.1.0"
description = "High-performance CLI and Python library to download 360° panoramas from Yandex Maps in maximum original resolution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "B10Sreg", email = "iam171181@gmail.com" }
]
keywords = [
    "yandex",
    "maps",
    "panorama",
    "streetview",
    "360-photo",
    "equirectangular",
    "vr",
    "downloader"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
metadata = [
    "pyexiv2>=2.11.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ypano = "yandex_panorama.cli:main"
yandex-panorama = "yandex_panorama.cli:main"

[project.urls]
Homepage = "https://github.com/B10Sreg/yandex-panorama-downloader"
Repository = "https://github.com/B10Sreg/yandex-panorama-downloader"
Issues = "https://github.com/B10Sreg/yandex-panorama-downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_panorama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
